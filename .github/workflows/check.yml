name: Reflect checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://unused.invalid/fixture_isolation
      - run: pnpm build
      - run: node tests/standalone-artifacts.mjs
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reflect_test
          POSTGRES_PASSWORD: reflect_test_only
          POSTGRES_DB: reflect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reflect_test -d reflect_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reflect_test:reflect_test_only@127.0.0.1:5432/reflect_test
      NEANDER_TEMPLATE_TEST_DATABASE_URL: postgresql://reflect_test:reflect_test_only@127.0.0.1:5432/reflect_test
      NEANDER_TEMPLATE_IMAGE: reflect:ci
      APP_ORIGIN: http://127.0.0.1:8080
      AUTH_TOKEN_KEY: reflect-ci-auth-token-key-32-characters
      HR_SETUP_KEY: reflect-ci-setup-key-at-least-32-chars
      SCHEDULER_SECRET: reflect-ci-scheduler-key-32-characters
      DEMO_PASSWORD: Reflect-ci-demo-password!
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - run: pnpm install --frozen-lockfile
      - run: docker build -f .neander/Dockerfile -t reflect:ci .
      - run: python3 scripts/test_entrypoint.py
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:template
